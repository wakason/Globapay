# SonarQube Configuration for GloBaPay Payment Portal
sonar.projectKey=globapay-payment-portal
sonar.organization=your-organization

# Project Information
sonar.projectName=GloBaPay International Payment Portal
sonar.projectVersion=1.0

# Source code paths
sonar.sources=app_backend/src,src
sonar.tests=app_backend/src/**/*.test.ts,app_backend/src/**/*.spec.ts,src/**/*.test.tsx,src/**/*.test.ts,src/**/*.spec.tsx

# Exclusions - exclude build artifacts, dependencies, and test files from source analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts,**/public/**,**/.next/**,**/.circleci/**,**/.github/**

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Language
sonar.language=ts,js

# Coverage Reports
sonar.typescript.lcov.reportPaths=coverage/lcov.info,coverage/backend-lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.d.ts

# Code Quality Settings
sonar.qualitygate.wait=true

# Security Hotspot Settings - Enable security hotspot analysis
# Note: Security hotspot analysis is enabled by default in SonarQube
sonar.security.hotspots.inheritFromParent=true

# Focus on detecting code smells and security hotspots
# Code smells are automatically detected - no special configuration needed
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore common false positives for code smells
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1128
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts

# Additional exclusion for React specific rules if needed
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S6478
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.tsx

# TypeScript/JavaScript Analysis Settings
sonar.typescript.node=18.18.0
sonar.sourceEncoding=UTF-8

# Duplication Detection
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Analysis parameters for better hotspot and code smell detection
# Note: Security hotspots and code smells are automatically detected by SonarQube
# No additional configuration needed beyond standard project settings

