# SonarQube Configuration for GloBaPay Payment Portal
sonar.projectKey=globapay-payment-portal
sonar.organization=your-organization

# Project Information
sonar.projectName=GloBaPay International Payment Portal
sonar.projectVersion=1.0

# Source code paths
sonar.sources=app_backend/src,src
sonar.tests=app_backend/src/**/*.test.ts,src/**/*.test.tsx

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/coverage/**

# Language
sonar.language=ts,js
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Code Quality Settings
sonar.qualitygate.wait=true

# Security Hotspot Settings
sonar.security.hotspots.inheritFromParent=true

# Coverage (if tests are configured)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
# sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx

# Additional settings for code smells and security
sonar.issue.ignore.multicriteria=e1,e2

# Ignore common false positives
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1128
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.ts

sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.ts

