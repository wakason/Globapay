version: 2.1

orbs:
  node: circleci/node@5.1.0
  sonarcloud: sonarsource/sonarcloud@2.0.0

jobs:
  build-and-test:
    docker:
      - image: cimg/node:18.18
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
          app-dir: app_backend
      - run:
          name: Build Backend
          command: |
            cd app_backend
            npm run build
      - run:
          name: Run Tests
          command: |
            cd app_backend
            npm test --if-present
      - run:
          name: NPM Audit
          command: |
            cd app_backend
            npm audit --audit-level=high || echo "Audit completed with warnings"
      - persist_to_workspace:
          root: .
          paths:
            - app_backend/dist
            - app_backend/node_modules
            - .

  sonarqube-scan:
    docker:
      - image: cimg/node:18.18
    steps:
      - checkout
      - attach_workspace:
          at: .
      - sonarcloud/scan:
          sonar_token_variable_name: SONAR_TOKEN

  security-scan:
    docker:
      - image: cimg/node:18.18
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: OWASP Dependency Check
          command: |
            cd app_backend
            npm audit --audit-level=moderate --json > audit-results.json || true
      - run:
          name: Check for Security Hotspots
          command: |
            cd app_backend
            # Additional security checks can be added here
            echo "Security scan completed"
      - store_artifacts:
          path: app_backend/audit-results.json

workflows:
  version: 2
  build-test-scan:
    jobs:
      - build-and-test
      - sonarqube-scan:
          requires:
            - build-and-test
          context: sonarcloud
      - security-scan:
          requires:
            - build-and-test

